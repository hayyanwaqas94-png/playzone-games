<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>PlayZone - Free Games</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f5f6f8;
 color:#17191c
}
button,input{font:inherit}
button{cursor:pointer}

header{
 position:sticky;
 top:0;
 z-index:100;
 background:#fff;
 border-bottom:1px solid #e5e5e5;
 min-height:68px;
 display:flex;
 align-items:center;
 gap:18px;
 padding:12px 25px
}
.logo{
 font-size:25px;
 font-weight:900;
 white-space:nowrap
}
.logo span{color:#ff3d7f}

.search{
 flex:1;
 max-width:650px;
 position:relative
}
.search input{
 width:100%;
 height:44px;
 border:1px solid #ddd;
 border-radius:24px;
 background:#f5f6f8;
 padding:0 45px 0 18px;
 outline:none
}
.search input:focus{
 background:#fff;
 border-color:#aaa
}
.search-icon{
 position:absolute;
 right:16px;
 top:11px;
 font-size:20px
}

.header-buttons{
 margin-left:auto;
 display:flex;
 gap:8px
}
.header-buttons button{
 border:0;
 background:#f0f1f3;
 padding:10px 14px;
 border-radius:12px;
 font-weight:700
}

.hero{
 max-width:1400px;
 margin:22px auto;
 padding:0 20px
}
.hero-box{
 min-height:270px;
 border:1px solid #e5e5e5;
 border-radius:24px;
 background:linear-gradient(135deg,#fff,#f0f1ff);
 padding:40px;
 display:flex;
 align-items:center;
 overflow:hidden;
 position:relative
}
.hero h1{
 margin:0 0 14px;
 font-size:48px;
 letter-spacing:-2px
}
.hero p{
 max-width:570px;
 color:#666;
 line-height:1.5;
 font-size:17px
}
.hero button{
 background:#17191c;
 color:#fff;
 border:0;
 padding:14px 22px;
 border-radius:12px;
 font-weight:bold
}
.hero-art{
 position:absolute;
 right:70px;
 width:260px;
 height:210px
}
.ball{
 position:absolute;
 border-radius:50%
}
.b1{
 width:150px;height:150px;
 background:#ff4d8d;
 right:35px;top:20px
}
.b2{
 width:90px;height:90px;
 background:#6c63ff;
 right:150px;top:85px
}
.b3{
 width:70px;height:70px;
 background:#ffc857;
 right:0;top:125px
}

.categories{
 max-width:1400px;
 margin:auto;
 padding:0 20px
}
.category-list{
 display:flex;
 gap:9px;
 overflow-x:auto;
 padding:4px 0 10px
}
.category-list::-webkit-scrollbar{display:none}
.category{
 flex:none;
 border:1px solid #ddd;
 background:#fff;
 padding:10px 17px;
 border-radius:22px;
 font-weight:bold
}
.category.active{
 background:#17191c;
 color:#fff;
 border-color:#17191c
}

main{
 max-width:1400px;
 margin:15px auto;
 padding:0 20px 60px
}
.title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:20px 0 15px
}
.title h2{margin:0;font-size:24px}
#count{color:#777;font-size:14px}

.games{
 display:grid;
 grid-template-columns:repeat(6,1fr);
 gap:14px
}
.game{
 background:#fff;
 border:1px solid #e3e3e3;
 border-radius:16px;
 overflow:hidden;
 cursor:pointer;
 transition:.18s;
 position:relative
}
.game:hover{
 transform:translateY(-4px);
 box-shadow:0 12px 28px #0001
}
.thumbnail{
 aspect-ratio:1;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:52px
}
.game-info{
 padding:11px 12px 13px
}
.game-name{
 font-weight:800;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}
.game-category{
 color:#858585;
 font-size:12px;
 margin-top:5px
}
.favorite{
 position:absolute;
 right:8px;
 top:8px;
 width:34px;
 height:34px;
 border:0;
 border-radius:50%;
 background:#ffffffe8;
 font-size:19px;
 z-index:2
}
.favorite.on{color:#ff3d7f}

.no-results{
 display:none;
 text-align:center;
 padding:70px 20px;
 color:#777
}

footer{
 background:#fff;
 border-top:1px solid #ddd;
 text-align:center;
 padding:30px;
 color:#777
}

/* GAME */
.modal{
 position:fixed;
 inset:0;
 z-index:999;
 background:#101114;
 display:none;
 flex-direction:column
}
.modal.open{display:flex}
.gamebar{
 height:60px;
 background:#17191c;
 color:#fff;
 display:flex;
 align-items:center;
 padding:0 14px;
 gap:12px
}
.gamebar button{
 background:#303238;
 color:#fff;
 border:0;
 padding:9px 13px;
 border-radius:9px
}
.game-title{
 flex:1;
 font-weight:bold
}
.game-area{
 flex:1;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:12px
}
canvas{
 width:min(100%,1000px);
 max-height:calc(100vh - 90px);
 aspect-ratio:16/9;
 background:#111;
 border-radius:12px;
 touch-action:none
}

@media(max-width:1100px){
 .games{grid-template-columns:repeat(5,1fr)}
}
@media(max-width:850px){
 .games{grid-template-columns:repeat(4,1fr)}
 .hero-art{opacity:.25;right:-40px}
 .hero h1{font-size:40px}
}
@media(max-width:600px){
 header{
  flex-wrap:wrap;
  padding:11px 12px
 }
 .search{
  order:3;
  flex-basis:100%
 }
 .hero{padding:0 12px}
 .hero-box{padding:28px;min-height:250px}
 .hero h1{font-size:34px}
 .hero-art{display:none}
 .categories,main{padding-left:12px;padding-right:12px}
 .games{
  grid-template-columns:repeat(2,1fr);
  gap:10px
 }
 .thumbnail{font-size:43px}
 .header-buttons button{
  padding:8px 10px
 }
}
</style>
</head>

["Rainbow Catch","Arcade","🌈","catch"],
["Final Blocks","Puzzle","🟦","target"]

];

/* ================================
   STATE
================================ */

let category="All";
let favorites=JSON.parse(localStorage.getItem("playzoneFavorites")||"[]");
let onlyFavorites=false;

const gamesBox=document.getElementById("games");
const search=document.getElementById("search");
const count=document.getElementById("count");
const noResults=document.getElementById("noResults");

/* ================================
   CATEGORIES
================================ */

const categoryNames=[
"All",
"Action",
"Arcade",
"Racing",
"Puzzle",
"Adventure",
"Sports"
];

categoryNames.forEach(name=>{

 const button=document.createElement("button");

 button.className="category"+(name==="All"?" active":"");

 button.textContent=name;

 button.onclick=function(){

  category=name;
  onlyFavorites=false;

  document.querySelectorAll(".category").forEach(b=>{
   b.classList.remove("active");
  });

  button.classList.add("active");

  render();

 };

 document.getElementById("categories").appendChild(button);

});

/* ================================
   RENDER
================================ */

function render(){

 gamesBox.innerHTML="";

 const query=search.value.toLowerCase().trim();

 let result=games.filter(g=>{

  const name=g[0].toLowerCase();
  const cat=g[1].toLowerCase();

  const matchCategory=
   category==="All" || g[1]===category;

  const matchSearch=
   !query || name.includes(query) || cat.includes(query);

  const matchFavorite=
   !onlyFavorites || favorites.includes(g[0]);

  return matchCategory && matchSearch && matchFavorite;

 });

 count.textContent=result.length+" games";

 noResults.style.display=result.length===0?"block":"none";

 result.forEach((g)=>{

  const index=games.indexOf(g);

  const card=document.createElement("div");
  card.className="game";

  const colors=[
   "#ffd8e8",
   "#dbe8ff",
   "#fff0b8",
   "#d8f4e5",
   "#e7ddff",
   "#d8f3ff",
   "#ffe1cc",
   "#e5e5ff"
  ];

  const thumb=document.createElement("div");
  thumb.className="thumbnail";
  thumb.style.background=colors[index%colors.length];
  thumb.textContent=g[2];

  const fav=document.createElement("button");
  fav.className="favorite";

  if(favorites.includes(g[0])){
   fav.classList.add("on");
   fav.textContent="♥";
  }else{
   fav.textContent="♡";
  }

  fav.onclick=function(e){

   e.stopPropagation();

   toggleFavorite(g[0]);

  };

  thumb.appendChild(fav);

  const info=document.createElement("div");
  info.className="game-info";

  const title=document.createElement("div");
  title.className="game-name";
  title.textContent=g[0];

  const cat=document.createElement("div");
  cat.className="game-category";
  cat.textContent=g[1];

  info.appendChild(title);
  info.appendChild(cat);

  card.appendChild(thumb);
  card.appendChild(info);

  card.onclick=function(){
   openGame(index);
  };

  gamesBox.appendChild(card);

 });

}

/* ================================
   FAVORITES
================================ */

function toggleFavorite(name){

 if(favorites.includes(name)){
  favorites=favorites.filter(x=>x!==name);
 }else{
  favorites.push(name);
 }

 localStorage.setItem(
  "playzoneFavorites",
  JSON.stringify(favorites)
 );

 render();
}

document.getElementById("favoritesButton").onclick=function(){

 onlyFavorites=!onlyFavorites;

 if(onlyFavorites){
  category="All";
  document.querySelectorAll(".category").forEach(b=>{
   b.classList.remove("active");
  });
  document.querySelector(".category").classList.add("active");
 }

 render();

};

/* ================================
   SEARCH
================================ */

search.addEventListener("input",render);

/* ================================
   RANDOM
================================ */

document.getElementById("random").onclick=function(){

 const index=Math.floor(Math.random()*games.length);

 openGame(index);

};

document.getElementById("featured").onclick=function(){
 openGame(0);
};

/* ================================
   GAME ENGINE
================================ */

const modal=document.getElementById("modal");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let current=null;
let animation=null;

let score=0;
let playerX=480;
let playerY=450;
let objects=[];
let target=null;
let snake=[];
let food=null;
let direction={x:1,y:0};
let gameOver=false;

const keys={
 left:false,
 right:false
};

function openGame(index){

 current=games[index];

 document.getElementById("gameTitle").textContent=current[0];

 modal.classList.add("open");

 document.body.style.overflow="hidden";

 startGame();

}

function closeGame(){

 if(animation){
  cancelAnimationFrame(animation);
 }

 modal.classList.remove("open");

 document.body.style.overflow="";

 current=null;

}

document.getElementById("back").onclick=closeGame;

document.getElementById("fullscreen").onclick=function(){

 const area=document.querySelector(".game-area");

 if(area.requestFullscreen){
  area.requestFullscreen();
 }

};

/* ================================
   START GAME
================================ */

function startGame(){

 if(animation){
  cancelAnimationFrame(animation);
 }

 score=0;
 playerX=480;
 playerY=450;
 objects=[];
 target=null;
 snake=[];
 food=null;
 direction={x:1,y:0};
 gameOver=false;

 if(current[3]==="target"){
  makeTarget();
 }

 if(current[3]==="catch"){
  for(let i=0;i<8;i++){
   objects.push({
    x:Math.random()*900+30,
    y:-Math.random()*500,
    speed:2+Math.random()*3
   });
  }
 }

 if(current[3]==="space"){
  for(let i=0;i<8;i++){
   objects.push({
    x:Math.random()*900+30,
    y:-Math.random()*500,
    speed:2+Math.random()*2
   });
  }
 }

 if(current[3]==="snake"){

  snake=[
   {x:480,y:280},
   {x:460,y:280},
   {x:440,y:280}
  ];

  food=makeFood();

 }

 animation=requestAnimationFrame(gameLoop);

}

/* ================================
   LOOP
================================ */

let lastTime=0;

function gameLoop(time){

 const delta=Math.min((time-lastTime)/16.67,3);

 lastTime=time;

 update(delta);
 draw();

 animation=requestAnimationFrame(gameLoop);

}

/* ================================
   UPDATE
================================ */

function update(dt){

 if(gameOver)return;

 const type=current[3];

 if(type==="runner")runner(dt);
 if(type==="racer")racer(dt);
 if(type==="catch")catchGame(dt);
 if(type==="space")space(dt);
 if(type==="jump")jump(dt);
 if(type==="snake")snakeGame(dt);

}

/* ================================
   RUNNER
================================ */

function runner(dt){

 if(keys.left)playerX-=7*dt;
 if(keys.right)playerX+=7*dt;

 playerX=Math.max(40,Math.min(920,playerX));

 if(Math.random()<.025*dt){

  objects.push({
   x:40+Math.random()*880,
   y:-50,
   speed:3+Math.random()*3
  });

 }

 objects.forEach(o=>{

  o.y+=o.speed*dt;

  if(
   Math.abs(o.x-playerX)<38 &&
   Math.abs(o.y-playerY)<45
  ){
   endGame();
  }

  if(o.y>590){

   o.y=-50;
   o.x=40+Math.random()*880;
   score++;

  }

 });

}

/* ================================
   RACER
================================ */

function racer(dt){

 if(keys.left)playerX-=8*dt;
 if(keys.right)playerX+=8*dt;

 playerX=Math.max(150,Math.min(810,playerX));

 if(Math.random()<.025*dt){

  objects.push({
   x:140+Math.random()*680,
   y:-80,
   speed:5+Math.random()*4
  });

 }

 objects.forEach(o=>{

  o.y+=o.speed*dt;

  if(
   Math.abs(o.x-playerX)<50 &&
   Math.abs(o.y-playerY)<65
  ){
   endGame();
  }

  if(o.y>620){

   o.y=-80;
   o.x=140+Math.random()*680;
   score++;

  }

 });

}

/* ================================
   CATCH
================================ */

function catchGame(dt){

 if(keys.left)playerX-=8*dt;
 if(keys.right)playerX+=8*dt;

 playerX=Math.max(40,Math.min(920,playerX));

 objects.forEach(o=>{

  o.y+=o.speed*dt;

  if(o.y>590){

   o.y=-30;
   o.x=30+Math.random()*900;

  }

  if(
   Math.abs(o.x-playerX)<45 &&
   Math.abs(o.y-playerY)<40
  ){

   score++;

   o.y=-30;
   o.x=30+Math.random()*900;

  }

 });

}

/* ================================
   SPACE
================================ */

function space(dt){

 if(keys.left)playerX-=8*dt;
 if(keys.right)playerX+=8*dt;

 playerX=Math.max(40,Math.min(920,playerX));

 objects.forEach(o=>{

  o.y+=o.speed*dt;

  if(o.y>590){

   o.y=-40;
   o.x=30+Math.random()*900;

  }

  if(
   Math.abs(o.x-playerX)<38 &&
   Math.abs(o.y-playerY)<38
  ){
   endGame();
  }

 });

}

/* ================================
   JUMP
================================ */

let velocityY=0;

function jump(dt){

 velocityY+=.5*dt;
 playerY+=velocityY*dt;

 if(playerY>=450){

  playerY=450;
  velocityY=-11;
  score++;

 }

 if(keys.left)playerX-=6*dt;
