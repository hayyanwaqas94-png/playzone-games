<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>PlayZone - Free Online Games</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#17191c;
  min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer;border:0}

.topbar{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e7e8eb;
  display:flex;
  align-items:center;
  gap:22px;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:100;
}
.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap;
}
.logo span{color:#ff3d7f}

.search{
  flex:1;
  max-width:620px;
  position:relative;
}
.search input{
  width:100%;
  height:44px;
  border:1px solid #dddfe3;
  border-radius:24px;
  padding:0 48px 0 18px;
  outline:none;
  background:#f6f7f9;
  transition:.2s;
}
.search input:focus{
  background:white;
  border-color:#b9bdc5;
}
.search-icon{
  position:absolute;
  right:16px;
  top:12px;
  font-size:19px;
}
.top-actions{
  margin-left:auto;
  display:flex;
  gap:9px;
}
.top-btn{
  background:#f1f2f4;
  border-radius:12px;
  padding:10px 14px;
  font-weight:700;
}
.top-btn:hover{background:#e7e8eb}

.hero{
  max-width:1400px;
  margin:24px auto 0;
  padding:0 24px;
}
.hero-card{
  min-height:280px;
  border-radius:24px;
  overflow:hidden;
  position:relative;
  display:flex;
  align-items:center;
  padding:42px;
  background:
    radial-gradient(circle at 85% 20%,#ffdfef 0 12%,transparent 30%),
    linear-gradient(135deg,#ffffff,#f0f1ff);
  border:1px solid #e4e5e9;
}
.hero-text{
  max-width:600px;
  position:relative;
  z-index:2;
}
.hero h1{
  font-size:48px;
  line-height:1;
  letter-spacing:-2px;
  margin-bottom:16px;
}
.hero p{
  color:#666b74;
  font-size:17px;
  line-height:1.5;
  margin-bottom:22px;
}
.play-featured{
  background:#17191c;
  color:white;
  padding:14px 23px;
  border-radius:13px;
  font-weight:800;
}
.play-featured:hover{transform:translateY(-2px)}

.hero-art{
  position:absolute;
  right:55px;
  width:310px;
  height:220px;
}
.orb{
  position:absolute;
  border-radius:50%;
}
.orb.one{
  width:170px;height:170px;
  background:#ff4d8d;
  right:45px;top:25px;
}
.orb.two{
  width:105px;height:105px;
  background:#6c63ff;
  right:175px;top:82px;
}
.orb.three{
  width:75px;height:75px;
  background:#ffc857;
  right:5px;top:130px;
}
.art-face{
  position:absolute;
  width:95px;height:95px;
  background:white;
  border-radius:50%;
  right:82px;top:62px;
  box-shadow:0 12px 35px #0002;
}
.art-face:before{
  content:"•  •";
  position:absolute;
  top:27px;
  left:27px;
  font-size:23px;
  letter-spacing:15px;
}
.art-face:after{
  content:"⌣";
  position:absolute;
  left:34px;
  top:44px;
  font-size:28px;
}

.categories{
  max-width:1400px;
  margin:22px auto 0;
  padding:0 24px;
}
.category-scroll{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:5px;
}
.category-scroll::-webkit-scrollbar{display:none}
.cat{
  flex:none;
  background:white;
  border:1px solid #e2e3e7;
  padding:10px 16px;
  border-radius:22px;
  font-weight:700;
}
.cat.active,.cat:hover{
  background:#17191c;
  color:white;
  border-color:#17191c;
}

.content{
  max-width:1400px;
  margin:30px auto;
  padding:0 24px 60px;
}
.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:30px 0 15px;
}
.section-title h2{
  font-size:24px;
  letter-spacing:-.5px;
}
.count{
  color:#777;
  font-size:14px;
}

.games-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:14px;
}
.game-card{
  background:#fff;
  border:1px solid #e5e6e9;
  border-radius:16px;
  overflow:hidden;
  position:relative;
  transition:.18s;
  cursor:pointer;
}
.game-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 30px #00000012;
}
.thumb{
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  position:relative;
  overflow:hidden;
}
.thumb:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,#ffffff18,transparent 60%);
}
.game-info{
  padding:11px 12px 13px;
}
.game-name{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.game-category{
  font-size:12px;
  color:#858991;
  margin-top:4px;
}
.fav{
  position:absolute;
  top:8px;
  right:8px;
  z-index:3;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#ffffffd9;
  font-size:18px;
}
.fav.active{color:#ff3d7f}

.empty{
  text-align:center;
  padding:60px 20px;
  color:#777;
  display:none;
}

.modal{
  position:fixed;
  inset:0;
  background:#101114;
  z-index:500;
  display:none;
  flex-direction:column;
}
.modal.show{display:flex}
.game-header{
  height:58px;
  background:#17191c;
  color:white;
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:12px;
}
.game-title{
  font-weight:800;
  flex:1;
}
.close-game,.full-game{
  background:#2b2e33;
  color:white;
  border-radius:9px;
  padding:9px 13px;
}
.game-area{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  overflow:hidden;
}
#gameCanvas{
  width:min(100%,1000px);
  max-height:calc(100vh - 100px);
  aspect-ratio:16/9;
  background:#111;
  border-radius:12px;
  touch-action:none;
}

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%) translateY(20px);
  background:#17191c;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:1000;
  font-weight:700;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

footer{
  background:white;
  border-top:1px solid #e4e5e8;
  padding:30px 24px;
  text-align:center;
  color:#777;
}
footer strong{color:#17191c}

@media(max-width:1100px){
  .games-grid{grid-template-columns:repeat(5,1fr)}
}
@media(max-width:850px){
  .games-grid{grid-template-columns:repeat(4,1fr)}
  .hero h1{font-size:38px}
  .hero-art{opacity:.35;right:-50px}
}
@media(max-width:620px){
  .topbar{
    height:auto;
    padding:12px;
    flex-wrap:wrap;
    gap:10px;
  }
  .logo{font-size:22px}
  .search{order:3;flex-basis:100%;max-width:none}
  .top-actions{margin-left:auto}
  .top-btn{padding:8px 10px}
  .hero{padding:0 12px}
  .hero-card{padding:28px;min-height:270px}
  .hero h1{font-size:34px}
  .hero-art{display:none}
  .categories{padding:0 12px}
  .content{padding:0 12px 40px}
  .games-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  .thumb{font-size:43px}
}

/* GAME UI */
.game-ui{
  position:absolute;
  color:white;
  font-weight:800;
  pointer-events:none;
}
</style>
</head>

/* =========================================================
   COLORS FOR GAME CARDS
   ========================================================= */

const backgrounds=[
 "#ffd6e7","#d9e7ff","#fff0b8","#d9f7e8",
 "#e7ddff","#d7f3ff","#ffe1cc","#e4e4ff"
];

/* =========================================================
   STATE
   ========================================================= */

let activeCategory="All";
let favorites=JSON.parse(localStorage.getItem("pzFavorites")||"[]");
let showFavorites=false;

/* =========================================================
   CATEGORY UI
   ========================================================= */

const categories=["All","Action","Arcade","Racing","Puzzle","Adventure","Sports"];

const categoryBox=document.getElementById("categories");

categories.forEach(cat=>{
  const b=document.createElement("button");
  b.className="cat"+(cat==="All"?" active":"");
  b.textContent=cat;
  b.onclick=()=>{
    activeCategory=cat;
    showFavorites=false;
    document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    renderGames();
  };
  categoryBox.appendChild(b);
});

/* =========================================================
   RENDER GAMES
   ========================================================= */

function renderGames(){

  const grid=document.getElementById("gamesGrid");
  const search=document.getElementById("searchInput").value.toLowerCase().trim();

  grid.innerHTML="";

  let filtered=games.filter(g=>{
    const categoryOK=activeCategory==="All" || g.c===activeCategory;
    const searchOK=g.n.toLowerCase().includes(search) || g.c.toLowerCase().includes(search);
    const favOK=!showFavorites || favorites.includes(g.n);
    return categoryOK && searchOK && favOK;
  });

  document.getElementById("gameCount").textContent=filtered.length+" games";

  document.getElementById("empty").style.display=filtered.length?"none":"block";

  filtered.forEach((game,index)=>{

    const originalIndex=games.indexOf(game);

    const card=document.createElement("article");
    card.className="game-card";

    const bg=backgrounds[originalIndex%backgrounds.length];

    card.innerHTML=`
      <div class="thumb" style="background:${bg}">
        <span>${game.e}</span>
        <button class="fav ${favorites.includes(game.n)?"active":""}" 
          onclick="toggleFavorite(event,'${escapeQuote(game.n)}')">
          ${favorites.includes(game.n)?"♥":"♡"}
        </button>
      </div>
      <div class="game-info">
        <div class="game-name">${game.n}</div>
        <div class="game-category">${game.c}</div>
      </div>
    `;

    card.onclick=()=>openGame(originalIndex);

    grid.appendChild(card);
  });
}

function escapeQuote(s){
  return s.replace(/'/g,"\\'");
}

function toggleFavorite(e,name){
  e.stopPropagation();

  if(favorites.includes(name)){
    favorites=favorites.filter(x=>x!==name);
    toast("Removed from favorites");
  }else{
    favorites.push(name);
    toast("Added to favorites ❤️");
  }

  localStorage.setItem("pzFavorites",JSON.stringify(favorites));
  renderGames();
}

/* =========================================================
   SEARCH
   ========================================================= */

document.getElementById("searchInput").addEventListener("input",renderGames);

/* =========================================================
   FAVORITES
   ========================================================= */

document.getElementById("favBtn").onclick=()=>{

  showFavorites=!showFavorites;

  if(showFavorites){
    activeCategory="All";
    document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
    document.querySelector(".cat").classList.add("active");
    toast("Showing your favorites ❤️");
  }else{
    toast("Showing all games");
  }

  renderGames();
};

const modal=document.getElementById("gameModal");
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

let currentGame=null;
let animation=null;
let gameState={};

function openGame(index){

  currentGame=games[index];

  document.getElementById("gameTitle").textContent=currentGame.n;

  modal.classList.add("show");
  document.body.style.overflow="hidden";

  resetGame();
}

function closeGame(){

  if(animation)cancelAnimationFrame(animation);

  modal.classList.remove("show");
  document.body.style.overflow="";

  currentGame=null;
}

function fullscreenGame(){

  const area=document.querySelector(".game-area");

  if(area.requestFullscreen){
    area.requestFullscreen();
  }
}

function resetGame(){

  if(animation)cancelAnimationFrame(animation);

  gameState={
    score:0,
    lives:3,
    time:0,
    x:canvas.width/2,
    y:canvas.height-80,
    vx:0,
    vy:0,
    objects:[],
    target:null,
    started:false,
    over:false,
    last:performance.now()
  };

  setupGame();

  animation=requestAnimationFrame(loop);
}
